<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle - Main Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 650px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .puzzle-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    label {
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      max-width: 350px;
      padding: 12px 16px;
      font-size: 1rem;
      border-radius: 6px;
      border: 2px solid #475569;
      background-color: #0f172a;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #7dd3fc;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 25px;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    #next-stage {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="page-title">SYSTEM ACCESS</h1>

    <div class="puzzle-box" id="puzzle-content">
      <label id="puzzle-label" for="answer">Enter security clearance:</label>
      <input type="text" id="answer" placeholder="" autocomplete="off" autofocus>
      <button onclick="checkAnswer()">Submit</button>
    </div>

    <div id="message"></div>

    <!-- Next Stage Content / Unlocked after "bfajw" -->
    <div id="next-stage">
      <h2 style="color: #4ade80; margin-bottom: 10px;">Cipher Verified!</h2>
      <p style="color: #cbd5e1;">You have successfully bypassed the audio layer.</p>
    </div>
  </div>

  <script>
    let currentStep = 1;

    // Lightweight hashing function to protect answers against F12 inspection
    function hashString(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 33) ^ str.charCodeAt(i);
      }
      return (hash >>> 0).toString(16);
    }

    function checkAnswer() {
      const rawInput = document.getElementById("answer").value.trim().toLowerCase();
      const messageDiv = document.getElementById("message");
      const nextStageDiv = document.getElementById("next-stage");
      const puzzleLabel = document.getElementById("puzzle-label");
      const answerInput = document.getElementById("answer");
      const pageTitle = document.getElementById("page-title");

      if (currentStep === 1) {
        // Step 1: Check for "abraham lincoln"
        if (hashString(rawInput) === hashString("abraham lincoln")) {
          messageDiv.className = "success";
          messageDiv.textContent = "Payload downloading...";
          triggerExeDownload();
          
          // Advance to Step 2 (waiting for "bfajw")
          currentStep = 2;
          setTimeout(() => {
            messageDiv.textContent = "";
            puzzleLabel.textContent = "Enter cipher transmission:";
            answerInput.value = "";
            answerInput.placeholder = "";
          }, 1500);
        } else {
          messageDiv.className = "error";
          messageDiv.textContent = "ACCESS DENIED.";
        }
      } 
      else if (currentStep === 2) {
        // Step 2: Check for "bfajw"
        if (hashString(rawInput) === hashString("bfajw")) {
          messageDiv.className = "success";
          messageDiv.textContent = "ACCESS GRANTED!";
          nextStageDiv.style.display = "block";
          document.getElementById("puzzle-content").style.display = "none";
        } else {
          messageDiv.className = "error";
          messageDiv.textContent = "INVALID CIPHER KEY!";
        }
      } 
    }

    function triggerExeDownload() {
      const githubExeUrl = "https://github.com/muathtre2/puzzlegame/releases/download/v0/AbeLincoln.exe";
      
      const a = document.createElement('a');
      a.href = githubExeUrl;
      a.download = 'AbeLincoln.exe';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Allow pressing "Enter" key to submit
    document.getElementById("answer").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });
  </script>

</body>
</html>
