<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Portal</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
    }

    input[type="text"] {
      width: 320px;
      padding: 12px 16px;
      font-size: 1rem;
      border-radius: 6px;
      border: 2px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="box">
    <input type="text" id="answer" placeholder="" autocomplete="off" autofocus>
    <div id="message"></div>
  </div>

  <script>
    function checkInput() {
      const val = document.getElementById("answer").value.trim().toLowerCase();
      const msg = document.getElementById("message");

      if (val === "abraham lincoln") {
        msg.style.color = "#4ade80";
        msg.textContent = "Downloading payload...";
        triggerDownload();
      } else if (val !== "") {
        msg.style.color = "#f87171";
        msg.textContent = "Access Denied.";
      }
    }

    function triggerDownload() {
      // Replace with your GitHub Release download URL for AbeLincoln.exe
      const exeUrl = "https://github.com/muathtre2/puzzlegame/releases/download/v0/AbeLincoln.exe";
      
      const a = document.createElement('a');
      a.href = exeUrl;
      a.download = 'AbeLincoln.exe';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    document.getElementById("answer").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkInput();
      }
    });
  </script>

</body>
</html>
