<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
  <style>
    body {
      background-color: #000000;
      color: #334155;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .hint {
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hint" id="prompt-text">CLICK.</div>

  <!-- Updated to point to wave.wav -->
  <audio id="audio-player" src="wave.wav"></audio>

  <script>
    const audio = document.getElementById("audio-player");
    const promptText = document.getElementById("prompt-text");
    let hasPlayed = false;

    function playAudio() {
      if (hasPlayed) return;
      
      audio.play().then(() => {
        hasPlayed = true;
        promptText.textContent = "...";
        
        audio.onended = () => {
          promptText.textContent = "waver";
        };
      }).catch(err => {
        console.log("Autoplay blocked, waiting for click.");
      });
    }

    // Try playing immediately on page load
    window.addEventListener('load', () => {
      playAudio();
    });

    // Fallback/Trigger on any click if browser blocks autoplay
    window.addEventListener('click', () => {
      playAudio();
    });
  </script>

</body>
</html>
