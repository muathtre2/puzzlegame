<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
  <style>
    body {
      background-color: #000000;
      color: #334155;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .hint {
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hint" id="prompt-text">Click anywhere to initialize audio transmission...</div>

  <!-- Load ggwave library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.3.0/ggwave.js"></script>
  <script>
    let ggwaveInstance = null;
    let hasPlayed = false;

    async function initGgwave() {
      if (hasPlayed) return;
      hasPlayed = true;

      document.getElementById("prompt-text").textContent = "Transmitting acoustic data...";

      // Initialize ggwave module
      const ggwaveModule = await ggwave();
      
      // Default parameters: normal waveform quality
      const parameters = ggwaveModule.getDefaultParameters();
      ggwaveInstance = new ggwaveModule.GGWave(parameters);

      playTransmission();
    }

    function playTransmission() {
      if (!ggwaveInstance) return;

      // The secret string payload transmitted via sound wave (e.g., your Caesar shift key)
      const textPayload = "SHIFT_VALUE_5"; 

      // Generate waveform data from text
      const waveform = ggwaveInstance.encode(textPayload, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);
      if (!waveform) return;

      // Play audio using Web Audio API
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sampleRate = audioCtx.sampleRate;
      
      // Create audio buffer
      const buffer = audioCtx.createBuffer(1, waveform.length, sampleRate);
      const channelData = buffer.getChannelData(0);
      
      for (let i = 0; i < waveform.length; i++) {
        channelData[i] = waveform[i] / 128.0; // normalize 8-bit audio data
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);

      setTimeout(() => {
        document.getElementById("prompt-text").textContent = "Transmission complete. Refresh to repeat.";
      }, 2000);
    }

    // Try to play automatically on load (works if browser allows)
    window.addEventListener('load', () => {
      // Create audio context on first user gesture or fallback
      window.addEventListener('click', () => {
        initGgwave();
      }, { once: true });
    });
  </script>

</body>
</html>
